[package]
name = "harness-cli"
description = "The `harness` binary: wires adapters together and hosts the front-ends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
harness-config.workspace = true
harness-context.workspace = true
harness-ports.workspace = true
harness-protocol.workspace = true
harness-provider-anthropic.workspace = true
harness-provider-openai.workspace = true
harness-runtime.workspace = true
harness-tools.workspace = true
harness-types.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "sync", "time"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core.workspace = true
zbus-secret-service-keyring-store.workspace = true

[dev-dependencies]
harness-testkit.workspace = true
tempfile.workspace = true

[lints]
workspace = true
