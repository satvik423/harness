[workspace]
resolver = "3"
members = [
    "crates/types",
    "crates/protocol",
    "crates/ports",
    "crates/config",
    "crates/testkit",
    "crates/cli",
    "crates/tools",
    "crates/context",
    "crates/runtime",
    "crates/provider-anthropic",
    "crates/provider-openai",
    "crates/policy",
    "crates/store-sqlite",
    "crates/tui",
    "crates/evals",
]
# Needs nightly (cargo +nightly fuzz run apply_patch); has its own lockfile.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# ---- internal crates (path dependencies) ----
harness-types = { path = "crates/types" }
harness-protocol = { path = "crates/protocol" }
harness-ports = { path = "crates/ports" }
harness-policy = { path = "crates/policy" }
harness-store-sqlite = { path = "crates/store-sqlite" }
harness-config = { path = "crates/config" }
harness-context = { path = "crates/context" }
harness-provider-anthropic = { path = "crates/provider-anthropic" }
harness-provider-openai = { path = "crates/provider-openai" }
harness-runtime = { path = "crates/runtime" }
harness-testkit = { path = "crates/testkit" }
harness-tools = { path = "crates/tools" }
harness-tui = { path = "crates/tui" }

# ---- external crates: one version each, minimal features ----
anyhow = "1.0.104"
async-trait = "0.1.92"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "event-stream", "bracketed-paste"] }
directories = "6.0.0"
eventsource-stream = "0.2.3"
futures = { version = "0.3.34", default-features = false, features = ["std", "alloc"] }
globset = { version = "0.4.21", default-features = false }
grep-regex = "0.1.14"
grep-searcher = { version = "0.1.17", default-features = false }
ignore = "0.4.34"
keyring-core = "1.0.1"
nix = { version = "0.32.0", default-features = false, features = ["signal", "fs"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
pty-process = { version = "0.5.4", default-features = false, features = ["async"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.4", default-features = false, features = ["crossterm"] }
regex = { version = "1.13.1", default-features = false, features = ["std", "perf", "unicode"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "system-proxy"] }
similar = "3.2.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
tokio-util = { version = "0.7.20", default-features = false }
toml = "1.2.1"
tracing = "0.1.44"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
ulid = { version = "3.0.0", features = ["serde"] }
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

# ---- dev / test ----
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.12.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"
