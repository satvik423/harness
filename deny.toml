# cargo-deny policy (CLAUDE.md rule 2). Run: cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are reported for workspace dependencies too.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
# Only licences actually used by dependencies; add more deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "MPL-2.0",
]

[licenses.private]
# Our own crates are publish = false; don't require them to match the list.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { name = "openssl", reason = "use rustls" },
    { name = "openssl-sys", reason = "use rustls" },
    { name = "serde_yaml", reason = "archived; use a maintained YAML crate" },
    { name = "async-std", reason = "the project uses tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
