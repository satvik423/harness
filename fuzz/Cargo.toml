[package]
name = "harness-fuzz"
description = "Fuzz targets for the harness (run with cargo +nightly fuzz)."
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
harness-tools = { path = "../crates/tools" }
libfuzzer-sys = "0.4.13"

# Its own workspace: the fuzz crate needs nightly and stays out of the main checks.
[workspace]

[[bin]]
name = "apply_patch"
path = "fuzz_targets/apply_patch.rs"
test = false
doc = false
bench = false
